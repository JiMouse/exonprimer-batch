<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exon Primers</title>
<meta name="description" content="Precomputed ExonPrimer-style intronic PCR primers for coding exons">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f8f9f8; --panel:#ffffff; --sunken:#f1f4f3; --ink:#1b2422; --muted:#5f6d69; --line:#dde3e0;
  --accent:#1f6f66; --accent-soft:#e2f0ed; --exon:#1f6f66; --utr:#b9c4c0;
  --fwd:#c9eccf; --fwd-ink:#17602a; --rev:#e7dcf6; --rev-ink:#5a2d91;
  --warn:#8a5200; --warn-soft:#fdf1dc; --ok:#1d7a3a; --ok-soft:#dcf1e1; --bad:#b3261e; --bad-soft:#f9dedc;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;margin-bottom:22px}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
h1 a{color:inherit;text-decoration:none}
h1 a:hover span{text-decoration:underline}
.meta a{margin-left:14px;white-space:nowrap}
h1 span{color:var(--accent)}
.meta{color:var(--muted);font-size:13px}
.meta a{color:var(--accent)}
.search{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search input{flex:1 1 260px;min-width:0;font:inherit;font-size:17px;padding:11px 14px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{font:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.gene-head{display:flex;flex-wrap:wrap;gap:4px 22px;align-items:baseline}
.gene-head h2{margin:0;font-size:26px;font-weight:600;font-style:italic}
.kv{color:var(--muted);font-size:13px}
.kv b{color:var(--ink);font-weight:500;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.exmap{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.ex{min-width:40px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);
  font:500 13px "IBM Plex Mono",monospace;cursor:default;text-align:center}
.ex.coding{border-color:var(--exon);color:var(--exon);cursor:pointer}
.ex.coding:hover{background:var(--accent-soft)}
.ex.sel{background:var(--exon);color:var(--panel)}
.ex.check{border-color:var(--warn);color:var(--warn)}
.ex.check.sel{background:var(--warn);color:var(--panel)}
.ex.fail{border-style:dashed;border-color:var(--bad);color:var(--bad)}
.ex.fail.sel{background:var(--bad);color:var(--panel)}
.pill{display:inline-block;font:600 11.5px "IBM Plex Sans",sans-serif;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:2px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.check{background:var(--warn-soft);color:var(--warn)} .pill.fail{background:var(--bad-soft);color:var(--bad)}
.warns{margin:0 0 14px;padding:10px 14px 10px 30px;background:var(--warn-soft);border-radius:8px;font-size:13px;color:var(--ink)}
.warns li{margin:2px 0}
.snps{display:block;font:400 11.5px "IBM Plex Sans",sans-serif;color:var(--warn);letter-spacing:0;margin-top:2px}
.snps a{color:inherit}
pre.amplicon .snp{outline:1.5px solid var(--warn);outline-offset:-1px;border-radius:2px}
.legend{margin-top:10px;font-size:12px;color:var(--muted)}
.amp h3{margin:0 0 4px;font-size:17px;font-weight:600}
.amp .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.badge{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:10px;background:var(--warn-soft);color:var(--warn);margin-left:6px;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.seq{font:600 14px "IBM Plex Mono",monospace;letter-spacing:.02em;word-break:break-all}
.tag{display:inline-block;font:600 12px "IBM Plex Mono",monospace;padding:2px 7px;border-radius:5px}
.tag.f{background:var(--fwd);color:var(--fwd-ink)} .tag.r{background:var(--rev);color:var(--rev-ink)}
.copy{font-size:12px;padding:4px 9px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin:16px 0 4px}
.facts div{font-size:12px;color:var(--muted)}
.facts b{display:block;font:500 15px "IBM Plex Mono",monospace;color:var(--ink)}
details{margin-top:14px}
summary{cursor:pointer;color:var(--accent);font-size:13.5px}
pre.amplicon{font:13px/1.7 "IBM Plex Mono",monospace;background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:10px 0 0;white-space:pre}
pre.amplicon .n{color:var(--muted);user-select:none}
pre.amplicon .e{color:var(--exon);font-weight:600}
pre.amplicon .pf{background:var(--fwd);color:var(--fwd-ink)}
pre.amplicon .pr{background:var(--rev);color:var(--rev-ink)}
.alt td{font-size:13px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.note{font-size:12.5px;color:var(--muted);margin-top:28px;line-height:1.6}
.table-scroll{overflow-x:auto}
.hot{color:var(--warn)}
td.muted{color:var(--muted)}
td.hot,b.hot{font-weight:600}
.pref{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.pref input{accent-color:var(--accent);width:15px;height:15px;margin:0;cursor:pointer}
.pref:hover{color:var(--ink)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:7px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:600px){ td.seq{font-size:12.5px} .gene-head h2{font-size:22px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="./" id="home" title="Back to the gene list">Exon<span>Primers</span></a></h1>
    <div class="meta"><span id="meta">Loading…</span>
      <a href="https://github.com/JiMouse/exonprimer-batch" target="_blank" rel="noopener">Source on GitHub</a></div>
  </header>

  <div class="search">
    <input id="q" list="genelist" placeholder="Gene, or a variant — MTHFR · NM_000110.4:c.1129G&gt;A · POLG:p.Trp748Ser · chr15:89327201" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Gene symbol or HGVS variant">
    <datalist id="genelist"></datalist>
    <a class="btn" href="exon_primers.xlsx" download>Download all (Excel)</a>
  </div>
  <div class="search" style="margin-top:-6px">
    <label class="pref" title="Re-reads the alternatives already published and puts a pair whose two primers are within 2 °C first. Nothing is redesigned.">
      <input type="checkbox" id="prefMatched"> Prefer primers matched to within 2 °C (&Delta;Tm)
    </label>
    <span class="kv" id="prefCount"></span>
  </div>

  <div id="view"><div class="panel empty">Choose a gene to see its coding exons and primers.</div></div>

  <p class="note" id="note"></p>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let META = null, GENE = null;
const cache = {};

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function copy(text, what){ navigator.clipboard.writeText(text).then(()=>toast(`${what} copied`)).catch(()=>toast('Copy failed')); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(n){ return Number(n).toLocaleString('en-US'); }

async function init(){
  try{
    META = await (await fetch('data/index.json')).json();
  }catch(e){
    $('#meta').textContent = 'No data yet — run the build workflow.'; return;
  }
  $('#meta').innerHTML = `${fmt(META.genes.length)} genes · ${esc(META.assembly)} · built ${esc(META.generated)}`;
  $('#genelist').innerHTML = META.genes.map(g=>`<option value="${esc(g.gene)}">${esc(g.transcript)}${g.refseq?' · '+esc(g.refseq):''}</option>`).join('');
  const p = META.params;
  $('#note').innerHTML = `Primers designed with Primer3 following the ExonPrimer approach: primer 3′ ends ≥ ${p.min_dist} bp from the exon/intron boundary, within a ${p.primer_region}-bp window; PCR products ${p.product_min}–${p.product_max} bp; exons too long for one product (targets over ${p.max_target} bp) get several overlapping primer pairs (${p.overlap}-bp overlap)${p.combine?'; exons with short introns combined':''}. Tm ${p.tm_min}–${p.tm_max} °C (opt ${p.tm_opt}), length ${p.size_min}–${p.size_max} nt. Target = ${p.target==='coding'?'coding part of each exon':'whole exon'}. Transcript: MANE Select (else Ensembl canonical).<br>
  <b>Safeguards.</b> Common SNPs (dbSNP 155, MAF ≥ ${p.snp_maf}) and repeats (RepeatMasker) are masked before design. Tiers: <i>clean</i> = no SNP and no repeat under primers; <i>repeat-5p</i> = repeat only in the 5′ part of a primer; <i>snp-5p</i> = SNP present but never in the last ${p.snp_3prime} bases. Targets in segmental duplications are flagged. ${META.ispcr ? 'Every candidate pair was checked genome-wide by in-silico PCR (isPcr); specific pairs are preferred.' : 'Genome-wide in-silico PCR was <b>not</b> run for this build — use the UCSC link.'}
  <b>OK</b> = clean tier, normal settings, no homology alert, no off-target product; <b>Check</b> = see the listed warnings.<br>
  <b>Tm.</b> Primer3's nearest-neighbour Tm (SantaLucia 1998) under PCR conditions: ${p.salt_mono!=null?p.salt_mono:50}&nbsp;mM&nbsp;Na⁺,
  ${p.salt_div!=null?p.salt_div:1.5}&nbsp;mM&nbsp;Mg²⁺, ${p.dntp!=null?p.dntp:0.6}&nbsp;mM&nbsp;dNTP, ${p.dna_conc!=null?p.dna_conc:50}&nbsp;nM primer.
  Calculators that model Na⁺ alone read about 6&nbsp;°C lower for the same oligo, so compare conventions before
  concluding two tools disagree. ΔTm is the difference between the two primers of a pair; the checkbox above
  re-orders the already-published alternatives to put a pair within ${DTM_LIMIT}&nbsp;°C first, without redesigning anything.<br>
  <b>Other transcripts.</b> A c. position numbered on a transcript this panel does not use cannot be mapped from the
  published data. Paste it anyway and the page offers to fetch that transcript's exon structure from the UCSC API and
  convert the position in your browser — on click only. Amplicons are keyed on the genomic position, so alternative
  transcripts that share an exon share the amplicon.`
    + (META.errors && META.errors.length ? `<br>Genes not processed: ${META.errors.map(e=>esc(e.gene)).join(', ')}.` : '');
  route();
}

async function loadGene(sym){
  const hit = META.genes.find(g=>g.gene.toUpperCase()===sym.toUpperCase());
  if(!hit) return null;
  if(!cache[hit.gene]) cache[hit.gene] = await (await fetch(`data/genes/${encodeURIComponent(hit.gene)}.json`)).json();
  return cache[hit.gene];
}

async function route(){
  const raw = decodeURIComponent(location.hash.slice(1));
  if(raw.startsWith('v=')){ const t=raw.slice(2); $('#q').value=t; return showVariant(t); }
  const [g, ex] = raw.split('/');
  if(!g){ return; }
  const gene = await loadGene(g);
  if(!gene){ $('#view').innerHTML = notInPanel(g); wireLookup(null); return; }
  GENE = gene; $('#q').value = gene.gene;
  renderGene(gene, ex ? parseInt(ex,10) : null);
}

function exonStatus(gene, n){
  const amps = ampsFor(gene,n), fails = failsFor(gene,n);
  if(fails.length && !amps.length) return 'fail';
  if(fails.length || amps.some(a=>a.status!=='OK')) return 'check';
  return 'ok';
}
function ampsFor(gene, n){ return gene.amplicons.filter(a=>a.exons.includes(n)); }
function failsFor(gene, n){ return gene.failures.filter(a=>a.exons.includes(n)); }

function renderGene(gene, exNum){
  const coding = gene.exons.filter(e=>e.coding);
  if(exNum==null && coding.length) exNum = coding[0].n;
  const chips = gene.exons.map(e=>{
    if(!e.coding) return `<span class="ex" title="Exon ${e.n}: non-coding">${e.n}</span>`;
    const st = exonStatus(gene, e.n);
    return `<button class="ex coding ${st}${e.n===exNum?' sel':''}" data-n="${e.n}" title="Exon ${e.n}: ${e.len} bp — ${st==='ok'?'OK':st==='check'?'check warnings':'no primers'}">${e.n}</button>`;
  }).join('');
  const head = `<div class="panel">
    <div class="gene-head">
      <h2>${esc(gene.gene)}</h2>
      <span class="kv">Transcript <b>${esc(gene.transcript)}</b></span>
      ${gene.refseq?`<span class="kv">RefSeq <b>${esc(gene.refseq)}</b></span>`:''}
      <span class="kv">chr<b>${esc(gene.chrom)}</b> (${gene.strand===1?'+':'−'})</span>
      <span class="kv">${esc(gene.selection)}</span>
    </div>
    <div class="exmap">${chips}</div>
    <div class="legend">Coding exons: <span class="pill ok">OK</span><span class="pill check">Check</span><span class="pill fail">No primers</span> · grey = non-coding.
      <button class="btn copy" id="copyGene" style="margin-left:8px">Copy all ${esc(gene.gene)} primers (TSV)</button></div>
  </div>`;
  const amps = exNum!=null ? ampsFor(gene, exNum) : [];
  const fails = exNum!=null ? failsFor(gene, exNum) : [];
  const body = amps.map(a=>renderAmp(gene,a)).join('') +
    fails.map(f=>`<div class="panel"><div class="amp"><h3>${esc(gene.gene)}_E${esc(f.label)} <span class="pill fail">No primers</span></h3>
      <div class="sub">Primer3 found no pair with these settings. ${esc(f.reason||'')}</div></div></div>`).join('');
  $('#view').innerHTML = head + (body || '<div class="panel empty">Select a coding exon.</div>');
  document.querySelectorAll('.ex.coding').forEach(b=>b.onclick=()=>{ location.hash = `${gene.gene}/${b.dataset.n}`; });
  const wide = gene.amplicons.filter(a=>a.pairs.length && dTm(a.pairs[0])>DTM_LIMIT);
  const fixable = wide.filter(a=>a.pairs.some(p=>dTm(p)<=DTM_LIMIT));
  $('#prefCount').textContent = wide.length
    ? `${gene.gene}: ${wide.length} of ${gene.amplicons.length} amplicons have ΔTm > ${DTM_LIMIT} °C at rank 1`
      + `, ${fixable.length} with a matched alternative`
    : `${gene.gene}: every amplicon is already within ${DTM_LIMIT} °C`;
  $('#copyGene').onclick = ()=>copy(geneTSV(gene), `${gene.gene} primers`);
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy, b.dataset.what));
}

/* ---------- matched-pair preference (A2/A3) ------------------------------
   dTm is derived from the published f_tm/r_tm, so both the display and the
   re-ordering work on the data as built - no rebuild involved.

   Primer3 ranked these pairs with PRIMER_PAIR_WT_DIFF_TM at its default of
   0, so it never *preferred* a matched pair; it only rejected pairs beyond
   PRIMER_PAIR_MAX_DIFF_TM. The preference below re-reads the alternatives
   already published and puts a matched pair first. It is opt-in: rank 1 is
   still Primer3's own choice, and it is better than the alternatives on the
   criteria that are not Tm (SNPs, repeats, in-silico PCR specificity).  */

const DTM_LIMIT = 2;                    // the delta asked for, in degrees C
let PREF_MATCHED = false;
try{ PREF_MATCHED = localStorage.getItem('prefMatchedTm') === '1'; }catch(e){}

function dTm(p){ return p.d_tm!=null ? p.d_tm : Math.abs(p.f_tm - p.r_tm); }
function dTmText(p){ return dTm(p).toFixed(1); }

/* Genome-wide specificity as a rank, so a promotion can never trade it away:
   the OK/Check badge and the in-silico PCR result were established for the
   pair the build put first. 2 = specific, 1 = never checked, 0 = off-target
   product or no product at all. */
function ispcrRank(p){
  const ip = p && p.ispcr;
  if(!ip || !ip.checked) return 1;
  if(ip.off_target && ip.off_target.length) return 0;
  return ip.on_target ? 2 : 0;
}

/* Pairs in display order: Primer3's, unless the preference is on and a
   published alternative is matched while rank 1 is not. A candidate must be
   at least as specific as rank 1, so the amplicon's status stays truthful.
   Stable, so the Primer3 order is kept inside each group. */
function orderedPairs(a){
  const ps = (a && a.pairs) || [];
  if(!PREF_MATCHED || ps.length < 2 || dTm(ps[0]) <= DTM_LIMIT) return ps;
  const floor = ispcrRank(ps[0]);
  const good = ps.filter(p=>dTm(p) <= DTM_LIMIT && ispcrRank(p) >= floor);
  return good.length ? good.concat(ps.filter(p=>!good.includes(p))) : ps;
}
function bestPair(a){ return orderedPairs(a)[0]; }
/* True when the preference actually moved a different pair to the front. */
function reordered(a){
  const ps = (a && a.pairs) || [];
  return ps.length > 1 && orderedPairs(a)[0] !== ps[0];
}

/* HGVS-RESOLVER-START */
/* ---------- HGVS variant lookup -------------------------------------------
   Resolves a variant to the amplicon that sequences it, entirely in the
   browser: the published gene JSON carries the CDS structure, the strand and
   every amplicon's genomic span, so no server is involved.

   Validated against Ensembl: CDS->genomic agrees with /map/cds, and the
   reference base read back from the amplicon sequence agrees with the
   Ensembl CDS for 1380/1380 sampled positions across both strands.        */

const AA3 = {Ala:'A',Arg:'R',Asn:'N',Asp:'D',Cys:'C',Gln:'Q',Glu:'E',Gly:'G',His:'H',
  Ile:'I',Leu:'L',Lys:'K',Met:'M',Phe:'F',Pro:'P',Ser:'S',Thr:'T',Trp:'W',Tyr:'Y',
  Val:'V',Ter:'*',Sec:'U'};

function parseHGVS(raw){
  const s = raw.trim().replace(/\s+/g,'');
  // optional "<reference>:" prefix - a transcript, RefSeq, chromosome or symbol
  const m = s.match(/^(?:([A-Za-z0-9_.()-]+):)?([cgpmn])\.(.+)$/);
  if(!m){
    // bare genomic: chr15:89327201 or 15:89327201C>T
    const g = s.match(/^(?:chr)?([0-9XYMxym]+):g?\.?([0-9,]+)([ACGT]>[ACGT])?$/);
    if(g) return {kind:'g', ref:'chr'+g[1].toUpperCase(), chrom:g[1].toUpperCase(),
                  pos:+g[2].replace(/,/g,''), desc:s};
    return null;
  }
  const [, refName, type, rest] = m;
  const out = {kind:type, ref:refName||null, desc:s, rest};
  if(type==='g'){
    const p = rest.match(/^([0-9,]+)/);
    if(!p) return null;
    out.pos = +p[1].replace(/,/g,'');
    if(refName && /^(?:chr)?[0-9XYMxym]+$/.test(refName)) out.chrom = refName.replace(/^chr/i,'').toUpperCase();
    return out;
  }
  if(type==='p'){
    const p = rest.match(/^\(?([A-Z][a-z]{2}|[A-Z])([0-9]+)/);
    if(!p) return null;
    out.codon = +p[2];
    out.aa = p[1].length===3 ? (AA3[p[1]]||p[1]) : p[1];
    return out;
  }
  // c. / n. - position, optional intron offset, optional second position
  const p = rest.match(/^(\*|-)?([0-9]+)([+-][0-9]+)?(?:_(\*|-)?([0-9]+)([+-][0-9]+)?)?(.*)$/);
  if(!p) return null;
  out.utr    = p[1] || null;           // '-' = 5'UTR, '*' = 3'UTR
  out.cpos   = +p[2];
  out.offset = p[3] ? +p[3] : 0;
  if(p[5]){ out.utr2 = p[4]||null; out.cpos2 = +p[5]; out.offset2 = p[6] ? +p[6] : 0; }
  out.change = p[7] || '';
  const sub = out.change.match(/^([ACGT])>([ACGT])$/);
  if(sub){ out.refBase = sub[1]; out.altBase = sub[2]; }
  return out;
}

function codingExons(gene){
  return gene.exons.filter(e=>e.coding).sort((a,b)=>a.n-b.n);
}
function cdsLength(gene){
  return codingExons(gene).reduce((t,e)=>t + (e.cds_end-e.cds_start+1), 0);
}

/* 1-based CDS position -> {pos, exon}; null when out of range. */
function cdsToGenomic(gene, cpos){
  let seen = 0;
  for(const e of codingExons(gene)){
    const len = e.cds_end - e.cds_start + 1;
    if(cpos <= seen + len){
      const off = cpos - seen - 1;
      return {pos: gene.strand===1 ? e.cds_start+off : e.cds_end-off, exon: e};
    }
    seen += len;
  }
  return null;
}

/* Reference base in TRANSCRIPT orientation, from a published amplicon.
   Sequences are fetched in transcript orientation, so a minus-strand
   amplicon string runs from `end` down to `start`. */
function refBaseAt(gene, pos){
  for(const a of gene.amplicons){
    // Any published pair will do: each carries its own span and sequence.
    for(const b of (a.pairs||[])){
      if(pos >= b.start && pos <= b.end){
        const i = gene.strand===1 ? pos-b.start : b.end-pos;
        return (b.amplicon[i]||'').toUpperCase();
      }
    }
  }
  return null;
}

/* Amplicons whose PCR product spans a position - what you'd actually order.
   An amplicon counts when ANY of its published pairs spans the position, so
   coverage does not change with the pair the page happens to show first. */
function covers(a, lo, hi){
  return (a.pairs||[]).some(b=>b.start<=hi && b.end>=lo);
}
function amplsCovering(gene, pos){
  return gene.amplicons.filter(a=>covers(a, pos, pos));
}

/* Map a parsed variant onto a transcript MODEL - anything carrying .exons,
   .strand, .chrom and .gene. Our own published gene is one such model; so is
   a foreign transcript fetched from UCSC, which is what lets the same
   arithmetic serve a transcript this panel does not carry. Fills `out` with
   pos / posEnd / exon / notes / warnings, or returns an error. */
function mapVariant(model, v, out){
  const gene = model;
  if(v.kind==='g'){
    if(v.chrom && v.chrom !== String(gene.chrom).toUpperCase())
      return {error:`Variant is on chr${v.chrom}, ${gene.gene} is on chr${gene.chrom}.`};
    out.pos = v.pos;
  } else if(v.kind==='p'){
    const L = cdsLength(gene), c1 = (v.codon-1)*3+1;
    if(c1 > L) return {error:`${gene.gene} codes ${Math.floor(L/3)-1} residues; p.${v.codon} is beyond it.`};
    const a = cdsToGenomic(gene, c1), b = cdsToGenomic(gene, c1+2);
    out.pos = a.pos; out.exon = a.exon;
    out.posEnd = b ? b.pos : a.pos;
    out.notes.push(`codon ${v.codon} = c.${c1}-${c1+2}`);
  } else {
    if(v.utr) return {error:`${v.utr==='-'?"5′":"3′"}UTR variant (c.${v.utr}${v.cpos}). This panel targets coding exons, so no amplicon covers it.`};
    const L = cdsLength(gene);
    if(v.cpos > L) return {error:`c.${v.cpos} is past the end of the ${gene.gene} CDS (${L} bp).`};
    const hit = cdsToGenomic(gene, v.cpos);
    if(!hit) return {error:`c.${v.cpos} could not be mapped in ${gene.gene}.`};
    out.exon = hit.exon;
    // An intron offset steps away from the exon in transcript direction.
    out.pos = v.offset ? hit.pos + (gene.strand===1 ? v.offset : -v.offset) : hit.pos;
    if(v.offset){
      const atEdge = gene.strand===1
        ? (v.offset>0 ? hit.pos===hit.exon.cds_end : hit.pos===hit.exon.cds_start)
        : (v.offset>0 ? hit.pos===hit.exon.cds_start : hit.pos===hit.exon.cds_end);
      out.notes.push(`intronic, ${Math.abs(v.offset)} bp from the exon ${hit.exon.n} boundary`);
      if(!atEdge) out.warnings.push(
        `c.${v.cpos} is not at an exon boundary, so the ${v.offset>0?'+':'-'}${Math.abs(v.offset)} offset is unusual - check the transcript.`);
    }
    if(v.cpos2!=null && !v.utr2){
      const h2 = cdsToGenomic(gene, v.cpos2);
      if(h2) out.posEnd = v.offset2 ? h2.pos + (gene.strand===1?v.offset2:-v.offset2) : h2.pos;
    }
  }
  return null;
}

/* Resolve a parsed variant against one gene of this panel. */
function resolveInGene(gene, v){
  const out = {gene, warnings: [], notes: []};
  const err = mapVariant(gene, v, out);
  if(err) return err;
  return attachAmplicons(gene, v, out);
}

/* Genomic position -> the amplicons that sequence it, plus the base check. */
function attachAmplicons(gene, v, out){
  out.amplicons = amplsCovering(gene, out.pos);
  if(out.posEnd!=null && out.posEnd!==out.pos){
    const lo = Math.min(out.pos,out.posEnd), hi = Math.max(out.pos,out.posEnd);
    out.span = [lo,hi];
    out.amplicons = gene.amplicons.filter(a=>covers(a, lo, hi));
  }

  // Reference-allele check, when we have the base and the variant states one.
  if(v.refBase){
    const got = refBaseAt(gene, out.pos);
    if(got && got!==v.refBase)
      out.warnings.push(`Reference mismatch: the genome has ${got} at this position, the variant says ${v.refBase}. Wrong transcript, build, or a typo.`);
    else if(got) out.notes.push(`reference base ${got} confirmed`);
  }
  return out;
}


/* ---------- a transcript this panel does not carry (A4/A5) ----------------
   The published JSON holds only the MANE Select structure, so a c. position
   numbered on another transcript cannot be mapped offline. UCSC's API serves
   the exon structure of any RefSeq accession and sends
   Access-Control-Allow-Origin: *, so the browser does the conversion itself
   and this stays a static site with no server of ours.

   Only ever on an explicit click: a static page must not call a third party
   on every keystroke. The amplicon itself is keyed on the genomic position,
   not on c. numbering, so once the position is known the transcript question
   disappears - and alternative transcripts often share the very exon, in
   which case the amplicon to order is exactly the same one.             */

const UCSC_API = 'https://api.genome.ucsc.edu';
const TX_TRACKS = ['ncbiRefSeqCurated', 'ncbiRefSeqSelect', 'ncbiRefSeq', 'knownGene'];
const bareAcc = a => String(a||'').split('.')[0].toUpperCase();

async function ucscJson(path){
  const r = await fetch(UCSC_API + path);
  if(!r.ok) throw new Error(`the UCSC API returned ${r.status}`);
  const j = await r.json();
  if(j.error) throw new Error(String(j.error));
  return j;
}

/* UCSC rows are 0-based half-open; our exons are 1-based inclusive. */
function ucscRowToModel(row, chrom){
  const strand = row.strand === '-' ? -1 : 1;
  const cdsLo = row.cdsStart + 1, cdsHi = row.cdsEnd;
  const nums = v => String(v==null?'':v).split(',').filter(x=>x!=='').map(Number);
  const starts = nums(row.exonStarts), ends = nums(row.exonEnds);
  if(!starts.length || starts.length !== ends.length)
    throw new Error(`${row.name} has no usable exon structure at UCSC.`);
  const blocks = starts.map((st,i)=>({start: st+1, end: ends[i]}));
  blocks.sort((a,b)=> strand===1 ? a.start-b.start : b.start-a.start);
  const exons = blocks.map((e,i)=>{
    const cs = Math.max(e.start, cdsLo), ce = Math.min(e.end, cdsHi);
    const coding = cdsHi >= cdsLo && cs <= ce;
    return {n:i+1, start:e.start, end:e.end, coding,
            cds_start: coding?cs:null, cds_end: coding?ce:null, len: e.end-e.start+1};
  });
  if(!exons.some(e=>e.coding))
    throw new Error(`${row.name} is not protein-coding, so it has no c. numbering.`);
  return {gene: row.name2 || '', transcript: row.name,
          chrom: String(chrom).replace(/^chr/,''), strand, exons};
}

/* Accession -> a transcript model, via two UCSC calls. */
async function ucscTranscript(acc){
  const db = META.ucsc_db;
  const found = await ucscJson(`/search?search=${encodeURIComponent(acc)}&genome=${encodeURIComponent(db)}`);
  let where = null;
  for(const t of (found.positionMatches||[])){
    for(const m of (t.matches||[])){
      const text = `${m.posName||''} ${m.hgFindMatches||''}`.toUpperCase();
      if(text.includes(bareAcc(acc)) && /^chr[\w.]+:\d+-\d+$/.test(m.position||'')){ where = m.position; break; }
    }
    if(where) break;
  }
  if(!where) throw new Error(`UCSC does not know ${acc} in ${db}.`);
  const chrom = where.split(':')[0];
  const [lo, hi] = where.split(':')[1].split('-').map(Number);
  for(const track of TX_TRACKS){
    let payload;
    try{
      payload = await ucscJson(`/getData/track?genome=${encodeURIComponent(db)};track=${track}`
        + `;chrom=${encodeURIComponent(chrom)};start=${Math.max(0, lo-1)};end=${hi}`);
    }catch(e){ continue; }
    const raw = payload[track];
    const rows = Array.isArray(raw) ? raw : ((raw && raw[chrom]) || []);
    const row = rows.find(r=>bareAcc(r.name) === bareAcc(acc));
    if(row) return ucscRowToModel(row, chrom);
  }
  throw new Error(`${acc} exists in ${db} but no RefSeq track carried its exon structure.`);
}

/* Do two exon structures place the same exon at the same coordinates? */
function sameExon(a, b){
  return a && b && a.start === b.start && a.end === b.end;
}

/* Full flow: foreign c. -> genomic -> our amplicon. */
async function resolveViaUcsc(v){
  const tx = await ucscTranscript(v.ref);
  const symbol = tx.gene || '';
  const entry = META.genes.find(g=>g.gene.toUpperCase() === symbol.toUpperCase());
  if(!entry) return {notInPanel: symbol || v.ref};

  const gene = await loadGene(entry.gene);
  if(!gene) return {error: `${esc(entry.gene)} has no data in this build.`};

  const out = {gene, warnings: [], notes: []};
  const err = mapVariant(tx, v, out);          // numbering from the transcript given
  if(err) return err;
  if(String(tx.chrom) !== String(gene.chrom))
    return {error: `${esc(v.ref)} is on chr${esc(tx.chrom)} but ${esc(gene.gene)} is on chr${esc(gene.chrom)} here.`};

  const foreignExon = out.exon;
  attachAmplicons(gene, v, out);               // amplicons and base check from ours

  out.notes.unshift(`mapped through ${tx.transcript} at UCSC (${esc(META.ucsc_db)})`);
  // Where the two transcripts agree on the exon, the amplicon is the same one.
  const mine = foreignExon && gene.exons.find(e=>sameExon(e, foreignExon));
  if(mine){
    out.exon = mine;
    out.notes.push(mine.n === foreignExon.n
      ? `${tx.transcript} and ${gene.transcript} share this exon (exon ${mine.n} in both)`
      : `exon ${foreignExon.n} of ${tx.transcript} is exon ${mine.n} of ${gene.transcript} - same coordinates, so the same amplicon`);
  }else if(foreignExon){
    out.exon = null;
    out.warnings.push(`Exon ${foreignExon.n} of ${v.ref} (chr${tx.chrom}:${fmt(foreignExon.start)}-${fmt(foreignExon.end)}) `
      + `has no exact counterpart in ${gene.transcript}. The amplicons below are the ones covering the position; check the boundaries.`);
  }
  out.warnings.push(`c. numbering came from ${v.ref}, not from ${gene.transcript} (this panel's transcript). `
    + `The position and the amplicon are what matter for ordering, but any c. coordinate shown elsewhere on this page is numbered on ${gene.transcript}.`);
  out.ucsc = tx;
  return out;
}

/* Offer the lookup rather than doing it unasked. */
function lookupOffer(v, acc){
  return `<div class="panel empty">
    <b>${esc(acc)}</b> is not the transcript this panel uses, so its c. numbering cannot be mapped from the published data.<br>
    Its exon structure can be fetched from the UCSC API and the position converted here, in your browser.
    <div style="margin-top:14px"><button class="btn" id="doLookup" data-acc="${esc(acc)}">Resolve ${esc(acc)} via UCSC</button></div>
    <div class="legend" style="margin-top:12px">One request to api.genome.ucsc.edu. Nothing is sent anywhere until you click.</div>
  </div>`;
}

/* HGVS-RESOLVER-END */

/* Pick the gene a variant refers to: its own reference if it names one,
   otherwise the gene whose span contains a genomic position. */
function geneEntryFor(v){
  const byName = n => META.genes.find(g=>g.gene.toUpperCase()===String(n).toUpperCase());
  const bare = a => String(a||'').split('.')[0].toUpperCase();
  if(v.ref){
    const direct = byName(v.ref);
    if(direct) return {hit:direct};
    const acc = bare(v.ref);
    const tx = META.genes.find(g=>bare(g.transcript)===acc || bare(g.refseq)===acc);
    if(tx){
      const full = (tx.refseq && bare(tx.refseq)===acc) ? tx.refseq : tx.transcript;
      // Same accession, different version: c. numbering can differ.
      if(full && full.toUpperCase()!==v.ref.toUpperCase())
        return {hit:tx, warn:`You gave ${v.ref}; this panel used ${full}. Coding coordinates usually agree between versions, but confirm before ordering.`};
      return {hit:tx};
    }
    if(/^(?:chr)?[0-9XYMxym]+$/.test(v.ref) || /^NC_0000/i.test(v.ref)){ /* a chromosome, handled below */ }
    else if(looksLikeAccession(v.ref) && v.kind!=='g'){
      // A transcript we do not carry: its numbering can be fetched (A5).
      return {lookup: v.ref};
    }
    else {
      const near = nearestSymbols(v.ref);
      return {error:`Check the spelling &mdash; otherwise <b>${esc(v.ref)}</b> is not a gene, transcript or RefSeq in our database.`
        + ` A different transcript may use different c. numbering, so no lookup was attempted.`
        + (near.length?`<br>Did you mean ${near.map(x=>`<a href="#${encodeURIComponent(x)}">${esc(x)}</a>`).join(' · ')}?`:'')};
    }
  }
  if(v.kind==='g'){
    let chrom = v.chrom;
    if(!chrom && /^NC_0000(\d\d)/i.test(v.ref||'')){
      const n = +RegExp.$1; chrom = n===23?'X':n===24?'Y':String(n);
    }
    if(!chrom) return {error:'Give a chromosome, e.g. chr15:89327201.'};
    const span = META.genes.filter(g=>String(g.chrom).toUpperCase()===chrom && g.start!=null && v.pos>=g.start && v.pos<=g.end);
    if(span.length) return {hit:span[0], extra:span.slice(1)};
    if(META.genes.every(g=>g.start==null))
      return {error:'This build predates coordinate search — rebuild the site, or search by gene or transcript.'};
    return {error:`No gene in this panel spans chr${esc(chrom)}:${fmt(v.pos)}.`};
  }
  if(GENE) return {hit:META.genes.find(g=>g.gene===GENE.gene), assumed:true};
  return {error:'Name the gene or transcript, e.g. POLG:c.2243G>C.'};
}

function variantPanel(v, res, entry){
  const g = res.gene;
  const loc = res.span ? `chr${g.chrom}:${fmt(res.span[0])}-${fmt(res.span[1])}` : `chr${g.chrom}:${fmt(res.pos)}`;
  const notes = [].concat(entry.warn?[entry.warn]:[], res.warnings||[]);
  const amps = res.amplicons||[];
  const rows = amps.map(a=>{
    const b=bestPair(a);
    if(!b) return '';
    const cls = a.status==='OK'?'ok':a.status==='CHECK'?'check':'fail';
    return `<tr><td><a href="#${encodeURIComponent(g.gene)}/${a.exons[0]}">${esc(g.gene)}_E${esc(a.label)}</a> <span class="pill ${cls}">${esc(a.status)}</span></td>
      <td class="seq">${esc(b.f_seq)}</td><td class="seq">${esc(b.r_seq)}</td><td>${b.product} bp</td>
      <td class="${dTm(b)>DTM_LIMIT?'hot':''}">${dTmText(b)}</td>
      <td>${fmt(b.start)}–${fmt(b.end)}</td></tr>`;
  }).join('');
  return `<div class="panel">
    <div class="gene-head"><h2>${esc(v.desc)}</h2>
      <span class="kv">${esc(g.gene)} · <b>${esc(g.transcript)}</b></span>
      ${res.ucsc?`<span class="kv">numbered on <b>${esc(res.ucsc.transcript)}</b></span>`:''}
      <span class="kv">maps to <b>${esc(loc)}</b></span>
      ${res.exon?`<span class="kv">exon <b>${res.exon.n}</b></span>`:''}
      ${entry.assumed?'<span class="badge">gene assumed from current view</span>':''}
    </div>
    ${res.notes&&res.notes.length?`<div class="legend">${res.notes.map(esc).join(' · ')}</div>`:''}
    ${notes.length?`<ul class="warns">${notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}
    ${amps.length
      ? `<div class="table-scroll"><table><thead><tr><th>Amplicon</th><th>Forward</th><th>Reverse</th><th>Product</th><th>ΔTm</th><th>Position</th></tr></thead><tbody>${rows}</tbody></table></div>
         <div class="legend">Use this pair to amplify and sequence the variant. Click the amplicon for the full record.</div>`
      : `<div class="panel empty" style="margin:0">No amplicon in this panel covers that position.${res.exon?` It maps near exon ${res.exon.n}, but primers only reach about ${META.params.primer_region} bp into the flanking intron.`:''}</div>`}
  </div>`;
}

/* ---------- "not in the panel" vs "not readable" ------------------------
   A real gene symbol that this build simply does not cover must not be
   reported as unreadable HGVS, so symbol- and accession-shaped queries get
   their own message, with the closest symbols we do carry.            */

function looksLikeSymbol(s){
  return /^[A-Za-z][A-Za-z0-9-]{0,14}$/.test(s) && /[A-Za-z]{2}/.test(s);
}
function looksLikeAccession(s){
  return /^(?:N[MGCR]|X[MR]|ENS[TG])[0-9_.]+$/i.test(s);
}
function editDistance(a,b){
  const m=a.length, n=b.length;
  if(Math.abs(m-n)>2) return 3;
  let prev=Array.from({length:n+1},(_,j)=>j), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++)
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
/* Closest symbols in the panel: one typo away first, then same-prefix. */
function nearestSymbols(q, limit=6){
  const u = q.toUpperCase(), syms = META ? META.genes.map(g=>g.gene) : [];
  const close = [], prefix = [];
  for(const s of syms){
    const d = editDistance(u, s.toUpperCase());
    if(d<=2) close.push([d,s]);
    else if(u.length>=3 && s.toUpperCase().startsWith(u.slice(0,Math.min(4,u.length)))) prefix.push(s);
  }
  close.sort((a,b)=>a[0]-b[0] || a[1].localeCompare(b[1]));
  return close.map(c=>c[1]).concat(prefix.sort()).slice(0, limit);
}
function notInPanel(text){
  const near = nearestSymbols(text);
  const links = near.map(s=>`<a href="#${encodeURIComponent(s)}">${esc(s)}</a>`).join(' · ');
  return `<div class="panel empty">Check the spelling &mdash; otherwise <b>${esc(text)}</b> is not in our database.<br>
    This panel covers ${fmt(META.genes.length)} genes; ${esc(text)} is not one of them.
    ${near.length?`<br>Did you mean ${links}?`:''}
    ${looksLikeAccession(text)?`<div style="margin-top:14px"><button class="btn" id="doLookup" data-acc="${esc(text)}">Ask UCSC which gene ${esc(text)} is</button></div>`:''}</div>`;
}

async function showVariant(text){
  const v = parseHGVS(text);
  if(!v){
    // Symbol- or accession-shaped input is a gene we do not carry, not bad HGVS.
    $('#view').innerHTML = (looksLikeSymbol(text.trim()) || looksLikeAccession(text.trim()))
      ? notInPanel(text.trim())
      : `<div class="panel empty">Could not read “${esc(text)}” as a gene or an HGVS variant.<br>Try <code>POLG:c.2243G>C</code>, <code>NM_000110.4:c.1129+5G>A</code>, <code>POLG:p.Trp748Ser</code> or <code>chr15:89327201</code>.</div>`;
    wireLookup(null);
    return;
  }
  const entry = geneEntryFor(v);
  if(entry.lookup){ $('#view').innerHTML = lookupOffer(v, entry.lookup); wireLookup(v); return; }
  if(entry.error){ $('#view').innerHTML = `<div class="panel empty">${entry.error}</div>`; return; }
  const gene = await loadGene(entry.hit.gene);
  if(!gene){ $('#view').innerHTML = `<div class="panel empty">${esc(entry.hit.gene)} has no data in this build.</div>`; return; }
  GENE = gene;
  const res = resolveInGene(gene, v);
  if(res.error){ $('#view').innerHTML = `<div class="panel empty">${esc(res.error)}</div>`; return; }
  $('#view').innerHTML = variantPanel(v, res, entry);
  wireButtons();
}

/* The UCSC lookup button, wherever it was rendered. */
function wireLookup(v){
  const btn = $('#doLookup');
  if(!btn) return;
  btn.onclick = async ()=>{
    const acc = btn.dataset.acc;
    btn.disabled = true; btn.textContent = `Asking UCSC about ${acc}…`;
    try{
      // No variant to place: just identify the gene and show it.
      if(!v || v.kind==='symbol'){
        const tx = await ucscTranscript(acc);
        const hit = tx.gene && META.genes.find(g=>g.gene.toUpperCase()===tx.gene.toUpperCase());
        if(hit){ toast(`${acc} is ${tx.gene}`); location.hash = hit.gene; return; }
        $('#view').innerHTML = notInPanel(tx.gene || acc) +
          `<div class="panel empty" style="margin-top:0">UCSC says ${esc(acc)} is <b>${esc(tx.gene||'unknown')}</b>.</div>`;
        wireLookup(null); return;
      }
      const res = await resolveViaUcsc(v);
      if(res.notInPanel){ $('#view').innerHTML = notInPanel(res.notInPanel); wireLookup(null); return; }
      if(res.error){ $('#view').innerHTML = `<div class="panel empty">${res.error}</div>`; return; }
      GENE = res.gene;
      $('#view').innerHTML = variantPanel(v, res, {warn:null});
      wireButtons();
    }catch(e){
      $('#view').innerHTML = `<div class="panel empty">Could not resolve ${esc(acc)}: ${esc(e.message||e)}<br>
        <span class="legend">The conversion needs api.genome.ucsc.edu. Search by gene, or paste the genomic position instead.</span></div>`;
    }
  };
}
function wireButtons(){
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy, b.dataset.what));
  wireLookup(null);
}

function ucscUrl(f,r){
  const q = new URLSearchParams({db:META.ucsc_db, wp_target:'genome', wp_f:f, wp_r:r, wp_size:4000, wp_perfect:15, wp_good:15, Submit:'submit'});
  return 'https://genome.ucsc.edu/cgi-bin/hgPcr?' + q;
}
function ucscBrowser(chrom,s,e){ return `https://genome.ucsc.edu/cgi-bin/hgTracks?db=${META.ucsc_db}&position=chr${chrom}:${s}-${e}`; }

function renderAmp(gene, a){
  const ps = orderedPairs(a), b = ps[0], name = `${gene.gene}_E${a.label}`;
  const span = a.exons.length>1 ? `Exons ${a.exons[0]}–${a.exons[a.exons.length-1]} combined` : `Exon ${a.exons[0]}`;
  const frag = a.fragment ? ` · fragment ${a.fragment}` : '';
  const alts = ps.slice(1).map(p=>`<tr><td>${p.rank}</td><td class="seq">${p.f_seq}${snpLine(p.f_snps,p.f_repeat)}</td><td class="seq">${p.r_seq}${snpLine(p.r_snps,p.r_repeat)}</td><td>${p.f_tm}/${p.r_tm}</td><td class="${dTm(p)>DTM_LIMIT?'hot':''}">${dTmText(p)}</td><td>${p.product}</td><td>${esc(ispcrText(p.ispcr))}</td></tr>`).join('');
  const hasNa = b.f_tm_na != null, hasUcsc = b.f_tm_ucsc != null;
  const swapped = reordered(a)
    ? `<li>Showing Primer3 rank ${b.rank} instead of rank 1: its primers are matched to within ${DTM_LIMIT} °C
        (ΔTm ${dTmText(b)} vs ${dTmText(a.pairs[0])}). Rank 1 is still listed under the alternatives, and it
        ranked first on the non-Tm criteria — compare the SNP and in-silico PCR columns before ordering.</li>`
    : '';
  return `<div class="panel amp">
    <h3>${esc(name)}${a.status==='OK'?'<span class="pill ok">OK</span>':'<span class="pill check">Check</span>'}</h3>
    <div class="sub">${span}${frag} · target ${fmt(a.target_len)} bp (${esc(META.params.target==='coding'?'coding part':'whole exon')}) · tier <i>${esc(a.tier)}</i>${a.relaxed?' (relaxed)':''}</div>
    ${a.warnings.length||swapped?`<ul class="warns">${swapped}${a.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}
    <div class="table-scroll"><table>
      <tr><th></th><th>Name</th><th>Sequence 5′→3′</th><th>Len</th><th title="Nearest-neighbour Tm under PCR conditions, with Mg²⁺">Tm °C</th>${hasNa?'<th title="The same tables with Mg²⁺ and dNTP at zero — what a Na⁺-only calculator reports">Tm Na⁺</th>':''}${hasUcsc?'<th title="What UCSC in-silico PCR prints: same salt as Tm Na⁺, but the older Breslauer/Rychlik 1990 tables (Primer3 PRIMER_TM_FORMULA=0) instead of SantaLucia 1998">Tm UCSC</th>':''}<th>GC %</th><th></th></tr>
      <tr><td><span class="tag f">F</span></td><td>${esc(name)}F</td><td class="seq">${b.f_seq}${snpLine(b.f_snps, b.f_repeat)}</td><td>${b.f_len}</td><td>${b.f_tm}</td>${hasNa?`<td class="muted">${b.f_tm_na}</td>`:''}${hasUcsc?`<td class="muted">${b.f_tm_ucsc}</td>`:''}<td>${b.f_gc}</td>
          <td><button class="btn copy" data-copy="${b.f_seq}" data-what="Forward primer">Copy</button></td></tr>
      <tr><td><span class="tag r">R</span></td><td>${esc(name)}R</td><td class="seq">${b.r_seq}${snpLine(b.r_snps, b.r_repeat)}</td><td>${b.r_len}</td><td>${b.r_tm}</td>${hasNa?`<td class="muted">${b.r_tm_na}</td>`:''}${hasUcsc?`<td class="muted">${b.r_tm_ucsc}</td>`:''}<td>${b.r_gc}</td>
          <td><button class="btn copy" data-copy="${b.r_seq}" data-what="Reverse primer">Copy</button></td></tr>
    </table></div>
    <div class="facts">
      <div>Product<b>${fmt(b.product)} bp</b></div>
      <div>ΔTm F–R<b class="${dTm(b)>DTM_LIMIT?'hot':''}">${dTmText(b)} °C</b></div>
      <div>F 3′ → exon<b>${b.f_dist} bp</b></div>
      <div>Exon → R 3′<b>${b.r_dist} bp</b></div>
      <div>In-silico PCR<b>${esc(ispcrText(b.ispcr))}</b></div>
      <div>Amplicon (${esc(META.assembly)})<b>chr${esc(b.chrom)}:${fmt(b.start)}-${fmt(b.end)}</b></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
      <a class="btn" target="_blank" rel="noopener" href="${ucscUrl(b.f_seq,b.r_seq)}">UCSC in-silico PCR</a>
      <a class="btn" target="_blank" rel="noopener" href="${ucscBrowser(b.chrom,b.start,b.end)}">View in UCSC browser</a>
      <button class="btn" data-copy="${esc(name)}F\t${b.f_seq}\n${esc(name)}R\t${b.r_seq}" data-what="Primer pair">Copy pair</button>
      <button class="btn" data-copy="${b.amplicon}" data-what="Amplicon">Copy amplicon</button>
    </div>
    <details><summary>Amplicon sequence (exon in colour, primers highlighted, SNPs boxed)</summary>${ampView(b)}</details>
    ${alts?`<details><summary>${ps.length-1} alternative pair${ps.length>2?'s':''}</summary>
      <div class="table-scroll"><table class="alt"><tr><th>#</th><th>Forward</th><th>Reverse</th><th>Tm F/R</th><th>ΔTm</th><th>Product</th><th>In-silico PCR</th></tr>${alts}</table></div></details>`:''}
  </div>`;
}

function ampView(b){
  const s = b.amplicon, L = s.length, W = 60, snpIdx = new Set();
  (b.f_snps||[]).forEach(x=>snpIdx.add(b.f_len - x.pos3));
  (b.r_snps||[]).forEach(x=>snpIdx.add(L - b.r_len + x.pos3 - 1));
  let out = '';
  for(let i=0;i<L;i+=W){
    out += `<span class="n">${String(i+1).padStart(5,' ')}  </span>`;
    for(let j=i;j<Math.min(i+W,L);j++){
      const c = s[j], isE = c===c.toUpperCase();
      const cls = j<b.f_len ? 'pf' : (j>=L-b.r_len ? 'pr' : (isE?'e':''));
      const k = (cls + (snpIdx.has(j)?' snp':'')).trim();
      out += k ? `<span class="${k}">${c}</span>` : c;
    }
    out += '\n';
  }
  return `<pre class="amplicon">${out}</pre>`;
}

function snpLine(snps, rep){
  const parts = (snps||[]).map(x=>`<a target="_blank" rel="noopener" href="https://www.ncbi.nlm.nih.gov/snp/${esc(x.rs)}">${esc(x.rs)}</a> ${x.pos3} nt from 3′${x.maf!=null?`, MAF ${x.maf.toFixed(2)}`:''}`);
  if(rep) parts.push(`${rep} nt in repeat`);
  return parts.length ? `<span class="snps">${parts.join(' · ')}</span>` : '';
}
function ispcrText(ip){
  if(!ip || !ip.checked) return 'not run';
  if(ip.off_target && ip.off_target.length) return `${ip.off_target.length} off-target`;
  return ip.on_target ? 'specific' : 'no product';
}
function geneTSV(gene){
  const rows = [['Name','Sequence','Exon','Product_bp','Tm','dTm_pair','Amplicon']];
  gene.amplicons.forEach(a=>{ const b=bestPair(a); if(!b) return;
    const n=`${gene.gene}_E${a.label}`, loc=`chr${b.chrom}:${b.start}-${b.end}`, d=dTmText(b);
    rows.push([n+'F', b.f_seq, a.label, b.product, b.f_tm, d, loc]);
    rows.push([n+'R', b.r_seq, a.label, b.product, b.r_tm, d, loc]); });
  return rows.map(r=>r.join('\t')).join('\n');
}

function submitQuery(text){
  const t = text.trim();
  if(!t) return;
  // A gene symbol wins over variant parsing, so a symbol is never misread.
  const isGene = META && META.genes.some(g=>g.gene.toUpperCase()===t.toUpperCase());
  location.hash = isGene ? t.toUpperCase() : 'v=' + encodeURIComponent(t);
}
$('#home').addEventListener('click', e=>{
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.button) return;   // let modified clicks open normally
  e.preventDefault();
  GENE = null; $('#q').value = '';
  history.pushState('', '', location.pathname + location.search);
  $('#view').innerHTML = '<div class="panel empty">Choose a gene to see its coding exons and primers.</div>';
});
$('#prefMatched').checked = PREF_MATCHED;
$('#prefMatched').addEventListener('change', e=>{
  PREF_MATCHED = e.target.checked;
  try{ localStorage.setItem('prefMatchedTm', PREF_MATCHED ? '1' : '0'); }catch(err){}
  route();                                   // re-render whatever is on screen
});
$('#q').addEventListener('change', e=>submitQuery(e.target.value));
$('#q').addEventListener('keydown', e=>{ if(e.key==='Enter') submitQuery(e.target.value); });
window.addEventListener('hashchange', route);
init();
</script>
</body>
</html>
